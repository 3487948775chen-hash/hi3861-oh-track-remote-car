<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小车MQTT遥控器</title>
    <script src="paho-mqtt-min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .status {
            text-align: center;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #666;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 20px;
            font-size: 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn.stop {
            background: #f44336;
        }
        .btn.direction {
            background: #2196F3;
        }
        .speed-control {
            margin-bottom: 20px;
        }
        .speed-control label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        .speed-control input[type="range"] {
            width: 100%;
            height: 10px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
        }
        .speed-value {
            display: inline-block;
            background: #2196F3;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 10px;
        }
        .connect-section {
            margin-bottom: 20px;
        }
        .connect-section input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .connect-btn {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .connect-btn:hover {
            background: #45a049;
        }
        .connected {
            background: #4CAF50 !important;
            color: white !important;
        }
        .disconnected {
            background: #f44336 !important;
            color: white !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 小车遥控器</h1>
        
        <div class="connect-section">
            <input type="text" id="broker" placeholder="MQTT Broker地址" value="ws://10.197.203.53:8083/mqtt">
            <input type="text" id="topic" placeholder="控制主题" value="name">
            <button class="connect-btn" id="connectBtn">连接MQTT</button>
        </div>
        
        <div class="status" id="status">未连接</div>
        
        <div class="speed-control">
            <label>速度: <span class="speed-value" id="speedValue">50</span>%</label>
            <input type="range" id="speedSlider" min="0" max="100" value="50">
        </div>
        
        <div class="controls">
            <div></div>
            <button class="btn direction" id="btnFwd">↑</button>
            <div></div>
            <button class="btn direction" id="btnLeft">←</button>
            <button class="btn stop" id="btnStop">○</button>
            <button class="btn direction" id="btnRight">→</button>
            <div></div>
            <button class="btn direction" id="btnBack">↓</button>
            <div></div>
        </div>
        
        <div class="status" id="carStatus">等待指令...</div>
    </div>

    <script>
        var client;
        var broker = document.getElementById('broker');
        var topic = document.getElementById('topic');
        var connectBtn = document.getElementById('connectBtn');
        var statusDiv = document.getElementById('status');
        var carStatusDiv = document.getElementById('carStatus');
        var speedSlider = document.getElementById('speedSlider');
        var speedValue = document.getElementById('speedValue');
        
       function connect() {
    // 1. 获取输入框的 IP 地址 (建议输入框中只填 10.46.123.53)
    var host = broker.value;
    var port = 8083; // WebSocket 端口
    var clientId = "web_client_" + Math.random().toString(16).substr(2, 8);

    console.log("准备连接到:", host, "端口:", port);

    // 2. 使用 Paho.Client 创建实例
    // 注意：Paho 库会自动添加 ws:// 协议，所以 host 参数只需 IP 即可
    client = new Paho.Client(host, port, clientId);

    // 3. 设置连接回调
    client.onConnectionLost = function(responseObject) {
        if (responseObject.errorCode !== 0) {
            statusDiv.innerHTML = "连接断开: " + responseObject.errorMessage;
            console.log("连接丢失:", responseObject.errorMessage);
        }
    };

    client.onMessageArrived = function(message) {
        console.log("收到消息:", message.payloadString);
        carStatusDiv.innerHTML = "收到: " + message.payloadString;
    };

    // 4. 发起连接
    // 修改发起连接的部分
client.connect({
    onSuccess: function() {
        statusDiv.innerHTML = "已连接";
        statusDiv.className = "status connected";
        client.subscribe(topic.value);
        console.log("MQTT 连接成功!");
    },
    onFailure: function(message) {
        statusDiv.innerHTML = "连接失败: " + message.errorMessage;
        console.log("连接失败详情:", message.errorMessage);
    },
    userName: "Still",           // 填入你代码中定义的用户名
    password: "123456chen",      // 填入你代码中定义的密码
    useSSL: false 
});
}
        
        function sendCommand(cmd) {
            if (!client || !client.isConnected()) {
                alert("请先连接MQTT");
                return;
            }
           var message = new Paho.Message(cmd);
            message.destinationName = topic.value;
            client.send(message);
            carStatusDiv.innerHTML = "已发送: " + cmd;
        }
        
        connectBtn.addEventListener('click', connect);
        
        document.getElementById('btnFwd').addEventListener('click', function() { sendCommand('FWD'); });
        document.getElementById('btnBack').addEventListener('click', function() { sendCommand('BACK'); });
        document.getElementById('btnLeft').addEventListener('click', function() { sendCommand('LEFT'); });
        document.getElementById('btnRight').addEventListener('click', function() { sendCommand('RIGHT'); });
        document.getElementById('btnStop').addEventListener('click', function() { sendCommand('STOP'); });
        
        speedSlider.addEventListener('input', function() {
            speedValue.innerHTML = this.value;
        });
        
        speedSlider.addEventListener('change', function() {
            sendCommand('SPEED:' + this.value);
        });
    </script>
</body>
</html>
